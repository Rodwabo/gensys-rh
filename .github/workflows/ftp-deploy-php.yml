name: FTP deploy PHP

# Manual deploy of listed backend files via LWS FTP.
# Secrets required: GENSYSRH_FTP_HOST, GENSYSRH_FTP_USER, GENSYSRH_FTP_PASS
# Never commit passwords â see docs/FTP_CREDENTIALS.md

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Comma-separated paths relative to repo root'
        required: true
        default: 'backend/app/Services/Workflow/AuditService.php'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload via curl FTP
        env:
          GENSYSRH_FTP_HOST: ${{ secrets.GENSYSRH_FTP_HOST }}
          GENSYSRH_FTP_USER: ${{ secrets.GENSYSRH_FTP_USER }}
          GENSYSRH_FTP_PASS: ${{ secrets.GENSYSRH_FTP_PASS }}
        run: |
          set -euo pipefail
          : "${GENSYSRH_FTP_HOST:?missing secret GENSYSRH_FTP_HOST}"
          : "${GENSYSRH_FTP_USER:?missing secret GENSYSRH_FTP_USER}"
          : "${GENSYSRH_FTP_PASS:?missing secret GENSYSRH_FTP_PASS}"
          # Dedicated FTP user chroots into public_html/gensys-rh â BASE is host root.
          BASE="ftp://${GENSYSRH_FTP_HOST}"
          AUTH="${GENSYSRH_FTP_USER}:${GENSYSRH_FTP_PASS}"
          IFS=',' read -ra FILES <<< "${{ github.event.inputs.files }}"
          for f in "${FILES[@]}"; do
            f="$(echo "$f" | xargs)"
            [[ -n "$f" ]] || continue
            [[ -f "$f" ]] || { echo "missing $f"; exit 1; }
            echo "PUT $f"
            curl -sS --connect-timeout 30 --max-time 180 --ftp-pasv --ftp-create-dirs \
              --user "$AUTH" -T "$f" "$BASE/$f"
            echo OK
          done
